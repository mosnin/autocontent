.pg-seg-btn[aria-selected="true"]{background:var(--io-surface);color:var(--io-text);box-shadow:0 1px 2px rgb(0 0 0/.08),0 0 0 1px var(--io-border)}
.pg-seg-btn:focus-visible,.pg-restart:focus-visible{outline:2px solid var(--io-accent);outline-offset:2px}
.pg-time{font-variant-numeric:tabular-nums;color:var(--io-text-secondary);min-width:44px;text-align:center}
.pg-restart{appearance:none;border:1px solid var(--io-border);background:transparent;color:var(--io-text-secondary);font:inherit;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
.pg-restart:hover{color:var(--io-text);border-color:var(--io-border-strong)}
.pg-bar + .io-root.io-page,.pg-bar + .io-root{min-height:calc(100dvh - 52px)}
.pg-toast{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--io-surface);border:1px solid var(--io-border);box-shadow:var(--io-shadow-card);font-family:var(--io-font-sans);color:var(--io-text);z-index:20;animation:io-in .25s var(--io-ease) both}
.pg-toast>svg{color:var(--io-success);flex:none}
.pg-toast>div{flex:1;min-width:0}
.pg-toast-title{font-weight:500}
.pg-toast-sub{font-size:13px;color:var(--io-text-secondary)}
.pg-bar ~ .io-root .io-dash{padding-bottom:150px}
@media (max-width:560px){.pg-toast{flex-wrap:wrap}.pg-toast .pg-restart{margin-left:30px}}
