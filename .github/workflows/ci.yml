name: CI

on:
  push:
  pull_request:

# Least privilege: every job only reads the repository. A job that needs more
# (none today) must ask for it itself.
permissions:
  contents: read

# One run per ref: a push to a PR branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MARKETER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          # The job never pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev extras)
        # --ignore-installed PyJWT works around a debian-managed PyJWT
        # present in some sandboxed environments; harmless on clean runners.
        run: pip install -e ".[dev]" --ignore-installed PyJWT

      - name: Ruff
        run: python -m ruff check src/marketer tests backend modal_app.py scripts

      - name: Apply migrations (integration gate)
        # Validates migration SQL syntax against a real Postgres instance.
        # Existing unit tests monkeypatch DB repos and do not need Postgres,
        # so this step is the sole integration coverage for migration SQL.
        run: python scripts/migrate.py up

      - name: Pytest
        run: python -m pytest tests/ -q

  web:
    name: Web (tsc + tests + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The job never pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Design-system guard
        # Fails on hard colours, dark: variants, off-system corners, pulsing
        # decoration, old-kit imports. Spec: web/design-system/README.md.
        run: npm run ds:guard

      - name: Unit tests (security helpers)
        # Proxy allowlist and header policy, CSRF check, body caps, agent
        # token mint/verify, rate limiter, preview flag, CSP directives.
        run: npm test

      - name: Dependency audit (report only)
        # Prints high/critical advisories in production dependencies. It does
        # not fail the build: a new advisory should not block unrelated work.
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported high or critical advisories in web/"

      - name: Next build (compile-only gate)
        # Clerk's static prerender hard-requires a valid publishable key,
        # which we deliberately don't ship in CI. We DO want to catch real
        # compile/type errors, so we check whether the build reached
        # "Compiled successfully" and only fail if it didn't.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2xlcmsuZGV2JA
        run: |
          set +e
          out=$(npx next build --no-lint 2>&1)
          rc=$?
          echo "$out"
          if echo "$out" | grep -q "Compiled successfully"; then
            echo "::notice::Compile succeeded; ignoring static-prerender failures (Clerk key not provided in CI)."
            exit 0
          fi
          exit $rc

  agent:
    name: Agent (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # agent/package.json engines: node >= 22.19
          node-version: "22"
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit (report only)
        run: pnpm audit --prod --audit-level high || echo "::warning::pnpm audit reported high or critical advisories in agent/"
