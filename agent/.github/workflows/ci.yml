name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-validate:
    name: Type safety & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Commit pnpm-lock.yaml: the pnpm cache above and reproducible installs need it.
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      # UI snippets in web/ (only when a module ships them).
      - run: pnpm run --if-present typecheck:web
      - run: pnpm lint
      # Known high/critical advisories in production dependencies fail the build.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm build

  semantic-evals:
    name: Agent evals (security, cost, tool selection)
    needs: audit-and-validate
    runs-on: ubuntu-latest
    # `secrets` is not allowed in job-level `if:`; map secrets to env and gate steps on a computed output.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_HARNESS_SECRET: ${{ secrets.EVAL_HARNESS_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVAL_BASE_URL: http://localhost:5173
    outputs:
      ran: ${{ steps.gate.outputs.ran }}
    steps:
      - name: Check eval secrets
        id: gate
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ ${#EVAL_HARNESS_SECRET} -ge 16 ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY / EVAL_HARNESS_SECRET (>= 16 chars) are not set: evals skipped. Deploys from main are blocked until they run (set vars.ALLOW_DEPLOY_WITHOUT_EVALS=true to override)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ran == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ran == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
        if: steps.gate.outputs.ran == 'true'
      - name: Write local secrets for the dev server
        if: steps.gate.outputs.ran == 'true'
        run: |
          {
            echo "OPENAI_API_KEY=\"$OPENAI_API_KEY\""
            echo "EVAL_HARNESS_SECRET=\"$EVAL_HARNESS_SECRET\""
            echo "SESSION_SIGNING_SECRET=\"ci-session-secret-$(openssl rand -hex 16)\""
            echo "APPROVAL_SIGNING_SECRET=\"ci-approval-secret-$(openssl rand -hex 16)\""
            echo "WEBHOOK_SIGNING_SECRET=\"ci-webhook-secret-$(openssl rand -hex 16)\""
          } > .dev.vars
      - name: Seed eval tenants (local KV only)
        if: steps.gate.outputs.ran == 'true'
        run: |
          for tenant in tenant_alpha tenant_corrupt; do node scripts/seed-dev-tenant.mjs --tenant "$tenant"; done
      - name: Pull gold datasets from R2 (optional)
        if: steps.gate.outputs.ran == 'true'
        continue-on-error: true
        run: npx wrangler r2 object get marketer-agents-workspaces/evals/promptfoo.tests.yaml --file evals/r2.tests.yaml --remote
      - name: Start local Worker harness (same port as pnpm dev)
        if: steps.gate.outputs.ran == 'true'
        run: |
          npx vite dev --port 5173 --strictPort > dev.log 2>&1 &
          npx wait-on -t 120000 http-get://localhost:5173/health
      - name: Run Promptfoo evaluation matrix (non-zero exit on any failing case)
        if: steps.gate.outputs.ran == 'true'
        run: pnpm exec promptfoo eval -c promptfoo.config.yaml --no-cache --no-share --no-progress-bar
      - name: Dev server log
        if: failure() && steps.gate.outputs.ran == 'true'
        run: tail -n 200 dev.log || true

  production-deploy:
    name: Deploy to Cloudflare
    needs: [audit-and-validate, semantic-evals]
    # Deploy only when tests passed AND evals passed (or a maintainer explicitly allowed deploys without evals).
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.semantic-evals.result == 'success'
      && (needs.semantic-evals.outputs.ran == 'true' || vars.ALLOW_DEPLOY_WITHOUT_EVALS == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      # Real KV namespace ids and a public PUBLIC_BASE_URL (never localhost or a placeholder) before deploying.
      - name: Deploy preflight
        run: bash scripts/canary.sh preflight
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Canary: /health answers 200 and a malformed approval token is rejected with 400 on the live Worker; a failure
      # fails the job (roll back with `npx wrangler rollback`). vars.CANARY_BASE_URL overrides the target
      # (default: PUBLIC_BASE_URL in wrangler.jsonc).
      - name: Canary verification
        env:
          CANARY_BASE_URL: ${{ vars.CANARY_BASE_URL }}
        run: bash scripts/canary.sh verify
