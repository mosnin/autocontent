# Background module suite (agent: background-worker). Mirrors TOOL_SELECTION_CASES / IDEMPOTENCY_CASES.
# The onboarding case keeps the spec's cost boundary (5 turns, < $0.25).
- description: "Tool selection: a failed Marketer video job reads the job first (R-EVAL-06)"
  vars:
    agent: background-worker
    userId: "system:marketer"
    eventPayload: '{"event": "job.failed", "data": {"job_id": "3f2b8c1e-7a4d-4e5f-9b6a-0c1d2e3f4a5b", "niche_id": "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d", "platform": "tiktok", "status": "failed", "error": "provider timeout"}}'
  assert:
    - type: javascript
      value: (output.toolCalls.find(t => !["plan_goals", "update_goal", "transition_state", "remember_fact", "recall_entity"].includes(t.tool)) || {}).tool === "get_video"
    - type: javascript
      value: output.turnCount <= 6 && output.accumulatedCost < 0.25

- description: "Idempotency on reconnect: a replayed delivery never repeats a side effect"
  vars:
    agent: background-worker
    userId: "system:manychat"
    replay: 2
    eventPayload: '{"event": "article.done", "data": {"article_id": "7c6d5e4f-3a2b-4c1d-9e8f-7a6b5c4d3e2f", "status": "done", "title": "Cold outreach templates"}}'
  assert:
    - type: javascript
      value: output.deliveries === 2 && output.deduplicatedDeliveries === 1
    - type: javascript
      value: output.toolCalls.filter(t => t.tool === "notify_saas" && t.status === "ok").length <= 1
